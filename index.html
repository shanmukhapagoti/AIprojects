<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f8fb">
  <title>Skyline — Weather, wherever you are</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f3f7fa;
      --surface: #ffffff;
      --ink: #162b3b;
      --muted: #718391;
      --line: #e8eef2;
      --blue: #2479a6;
      --blue-deep: #155576;
      --sky: #dff1f8;
      --sun: #f5bd64;
      --shadow: 0 18px 55px rgba(36, 72, 94, .09);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 42px 20px 30px;
      background:
        radial-gradient(ellipse at 50% -20%, #dff1f8 0, transparent 48%),
        var(--page);
      color: var(--ink);
      font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    .app { width: min(100%, 760px); margin: 0 auto; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 25px;
    }
    .brand { display: flex; align-items: center; gap: 11px; font-size: 16px; font-weight: 750; letter-spacing: -.03em; }
    .brand-mark {
      width: 34px; height: 34px; display: grid; place-items: center;
      border-radius: 12px; background: #d9edf5; color: var(--blue);
    }
    .brand-mark svg { width: 21px; height: 21px; }
    .live-label { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 7px; }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #55b88c; box-shadow: 0 0 0 3px #55b88c20; }
    .search-wrap { margin-bottom: 20px; }
    .search {
      display: flex; align-items: center; gap: 10px;
      min-height: 52px; padding: 5px 6px 5px 16px;
      border: 1px solid #e2eaf0; border-radius: 15px;
      background: var(--surface); box-shadow: 0 4px 18px #25485d0a;
    }
    .search svg { width: 19px; height: 19px; color: #8294a1; flex: none; }
    .search input {
      min-width: 0; flex: 1; border: 0; outline: 0; color: var(--ink);
      background: transparent; font-size: 15px;
    }
    .search input::placeholder { color: #99a8b2; }
    .search button {
      border: 0; border-radius: 11px; padding: 10px 16px;
      background: var(--blue); color: white; font-size: 14px; font-weight: 650;
      cursor: pointer; transition: background .18s, transform .18s;
    }
    .search button:hover { background: var(--blue-deep); }
    .search button:active { transform: scale(.97); }
    .search button:disabled { opacity: .65; cursor: wait; }
    .message { min-height: 20px; margin: 6px 3px 0; color: var(--muted); font-size: 12px; }
    .message.error { color: #b45645; }
    .current {
      position: relative; overflow: hidden; min-height: 282px;
      padding: 29px 34px 27px; border-radius: 23px;
      color: white; background: linear-gradient(122deg, #246f95, #398eae 58%, #5ba8bd);
      box-shadow: 0 20px 45px rgba(35, 103, 136, .19);
    }
    .current::before, .current::after {
      position: absolute; content: ""; border-radius: 50%; pointer-events: none;
      background: rgba(255,255,255,.065);
    }
    .current::before { width: 310px; height: 310px; right: -72px; top: -157px; }
    .current::after { width: 230px; height: 230px; right: 110px; bottom: -183px; }
    .current-content { position: relative; z-index: 1; }
    .place-row { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .eyebrow { margin: 0 0 4px; color: #d6edf5; font-size: 12px; font-weight: 650; letter-spacing: .12em; text-transform: uppercase; }
    .city { margin: 0; font-size: 26px; line-height: 1.25; font-weight: 690; letter-spacing: -.035em; }
    .local-time { margin-top: 5px; color: #d5eaf1; font-size: 13px; }
    .current-main { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-top: 20px; }
    .temp { font-size: clamp(66px, 12vw, 88px); font-weight: 350; letter-spacing: -.085em; line-height: 1; }
    .temp sup { position: relative; top: -1.25em; margin-left: 3px; font-size: .29em; font-weight: 500; letter-spacing: 0; }
    .condition { margin-top: 8px; color: #e4f2f6; font-size: 16px; }
    .weather-icon { font-size: 82px; line-height: 1; filter: drop-shadow(0 8px 14px #173c4a35); margin-right: 21px; }
    .stats {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 13px; margin-top: 23px; padding-top: 17px;
      border-top: 1px solid rgba(255,255,255,.2);
    }
    .stat-label { display: block; color: #d2e8ef; font-size: 12px; }
    .stat-value { display: block; margin-top: 2px; color: white; font-size: 14px; font-weight: 650; }
    .forecast-heading { display: flex; justify-content: space-between; align-items: baseline; margin: 28px 2px 13px; }
    .forecast-heading h2 { margin: 0; font-size: 17px; letter-spacing: -.02em; }
    .forecast-heading span { color: var(--muted); font-size: 12px; }
    .forecast { display: grid; grid-template-columns: repeat(5, 1fr); gap: 11px; }
    .day-card {
      display: flex; min-height: 161px; flex-direction: column; align-items: center;
      padding: 15px 8px 13px; border: 1px solid var(--line); border-radius: 16px;
      background: var(--surface); text-align: center; box-shadow: 0 5px 18px #25485d07;
    }
    .day-name { color: var(--muted); font-size: 12px; font-weight: 600; }
    .day-icon { margin: 10px 0 9px; font-size: 28px; line-height: 1.1; }
    .day-condition { flex: 1; color: #526977; font-size: 11px; }
    .day-temps { display: flex; gap: 9px; margin-top: 8px; font-size: 13px; font-weight: 700; }
    .day-low { color: #91a0aa; font-weight: 500; }
    .footer { margin-top: 23px; text-align: center; color: #94a2ab; font-size: 11px; }
    .footer a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
    @media (max-width: 560px) {
      body { padding: 25px 15px 24px; }
      .topbar { margin-bottom: 20px; }
      .current { min-height: 0; padding: 24px 22px 22px; border-radius: 20px; }
      .current-main { margin-top: 23px; }
      .weather-icon { margin-right: 4px; font-size: 66px; }
      .forecast { gap: 7px; }
      .day-card { min-height: 146px; padding: 13px 4px 11px; border-radius: 13px; }
      .day-temps { gap: 5px; font-size: 12px; }
      .day-condition { font-size: 10px; }
    }
    @media (max-width: 360px) {
      body { padding-inline: 11px; }
      .day-name { font-size: 11px; }
      .day-card { padding-inline: 2px; }
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --page: #101b24;
        --surface: #192832;
        --ink: #e7f0f4;
        --muted: #9aabb5;
        --line: #2b3c47;
        --blue: #378db5;
        --blue-deep: #2d799e;
        --sky: #203b4a;
        --shadow: 0 18px 55px #0003;
      }
      body { background: radial-gradient(ellipse at 50% -20%, #203b4a 0, transparent 48%), var(--page); }
      .brand-mark { background: #203b4a; }
      .search { border-color: var(--line); box-shadow: 0 4px 18px #0002; }
      .search input::placeholder { color: #82949e; }
      .day-condition { color: #c0cdd3; }
      .day-low { color: #8d9ca5; }
      .footer { color: #81919a; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M7.5 17.5h9.1a4.1 4.1 0 0 0 .2-8.2 5.8 5.8 0 0 0-11.2 1.4A3.4 3.4 0 0 0 7.5 17.5Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="m9 20 1-1.5M14 20l1-1.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </span>
        Skyline
      </div>
      <div class="live-label"><span class="live-dot" aria-hidden="true"></span><span id="data-status">Weather outlook</span></div>
    </header>

    <form class="search-wrap" id="search-form" role="search">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input id="city-input" type="search" placeholder="Search for a city…" aria-label="Search for a city" autocomplete="off">
        <button id="search-button" type="submit">Search</button>
      </div>
      <p class="message" id="message" role="status" aria-live="polite"></p>
    </form>

    <section class="current" aria-labelledby="city-name">
      <div class="current-content">
        <div class="place-row">
          <div>
            <p class="eyebrow">Current weather</p>
            <h1 class="city" id="city-name">Tokyo, Japan</h1>
            <div class="local-time" id="local-time">Today</div>
          </div>
        </div>
        <div class="current-main">
          <div>
            <div class="temp" id="temperature">18<sup>°C</sup></div>
            <div class="condition" id="condition">Partly cloudy</div>
          </div>
          <div class="weather-icon" id="current-icon" aria-hidden="true">🌤️</div>
        </div>
        <div class="stats">
          <div><span class="stat-label">Feels like</span><span class="stat-value" id="feels-like">19°</span></div>
          <div><span class="stat-label">Humidity</span><span class="stat-value" id="humidity">62%</span></div>
          <div><span class="stat-label">Wind</span><span class="stat-value" id="wind">12 km/h</span></div>
        </div>
      </div>
    </section>

    <section aria-labelledby="forecast-title">
      <div class="forecast-heading">
        <h2 id="forecast-title">5-day forecast</h2>
        <span id="forecast-location">Tokyo</span>
      </div>
      <div class="forecast" id="forecast-grid" aria-live="polite">
        <article class="day-card"><span class="day-name">Today</span><span class="day-icon" aria-hidden="true">🌤️</span><span class="day-condition">Partly cloudy</span><span class="day-temps"><span>20°</span><span class="day-low">14°</span></span></article>
        <article class="day-card"><span class="day-name">Tue</span><span class="day-icon" aria-hidden="true">☀️</span><span class="day-condition">Sunny</span><span class="day-temps"><span>22°</span><span class="day-low">15°</span></span></article>
        <article class="day-card"><span class="day-name">Wed</span><span class="day-icon" aria-hidden="true">🌦️</span><span class="day-condition">Showers</span><span class="day-temps"><span>19°</span><span class="day-low">13°</span></span></article>
        <article class="day-card"><span class="day-name">Thu</span><span class="day-icon" aria-hidden="true">🌤️</span><span class="day-condition">Partly cloudy</span><span class="day-temps"><span>21°</span><span class="day-low">14°</span></span></article>
        <article class="day-card"><span class="day-name">Fri</span><span class="day-icon" aria-hidden="true">☀️</span><span class="day-condition">Sunny</span><span class="day-temps"><span>23°</span><span class="day-low">16°</span></span></article>
      </div>
    </section>
    <footer class="footer">Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noreferrer">Open-Meteo</a></footer>
  </main>
  <script>
    const fallback = {
      city: "Tokyo", country: "Japan", timezone: "Asia/Tokyo",
      current: { temperature_2m: 18, apparent_temperature: 19, relative_humidity_2m: 62, wind_speed_10m: 12, weather_code: 2 },
      daily: {
        time: Array.from({ length: 5 }, (_, index) => {
          const date = new Date();
          date.setUTCHours(0, 0, 0, 0);
          date.setUTCDate(date.getUTCDate() + index);
          return date.toISOString().slice(0, 10);
        }),
        weather_code: [2, 0, 80, 2, 0],
        temperature_2m_max: [20, 22, 19, 21, 23],
        temperature_2m_min: [14, 15, 13, 14, 16]
      }
    };
    const weatherTypes = [
      { codes: [0], label: "Clear sky", icon: "☀️" },
      { codes: [1], label: "Mainly clear", icon: "🌤️" },
      { codes: [2], label: "Partly cloudy", icon: "🌤️" },
      { codes: [3], label: "Overcast", icon: "☁️" },
      { codes: [45, 48], label: "Foggy", icon: "🌫️" },
      { codes: [51, 53, 55, 56, 57], label: "Drizzle", icon: "🌦️" },
      { codes: [61, 63, 65, 66, 67, 80, 81, 82], label: "Rain showers", icon: "🌧️" },
      { codes: [71, 73, 75, 77, 85, 86], label: "Snow", icon: "❄️" },
      { codes: [95, 96, 99], label: "Thunderstorm", icon: "⛈️" }
    ];
    const byId = (id) => document.getElementById(id);
    const form = byId("search-form");
    const input = byId("city-input");
    const button = byId("search-button");
    const message = byId("message");

    function weatherFor(code) {
      return weatherTypes.find((type) => type.codes.includes(code)) || { label: "Changeable", icon: "🌥️" };
    }
    function dayName(dateString, index) {
      if (index === 0) return "Today";
      return new Intl.DateTimeFormat(undefined, { weekday: "short", timeZone: "UTC" }).format(new Date(dateString + "T12:00:00Z"));
    }
    function showWeather(data, isFallback) {
      const current = data.current;
      const currentWeather = weatherFor(current.weather_code);
      byId("city-name").textContent = [data.city, data.country].filter(Boolean).join(", ");
      byId("forecast-location").textContent = data.city;
      byId("temperature").innerHTML = `${Math.round(current.temperature_2m)}<sup>°C</sup>`;
      byId("condition").textContent = currentWeather.label;
      byId("current-icon").textContent = currentWeather.icon;
      byId("feels-like").textContent = `${Math.round(current.apparent_temperature)}°`;
      byId("humidity").textContent = `${Math.round(current.relative_humidity_2m)}%`;
      byId("wind").textContent = `${Math.round(current.wind_speed_10m)} km/h`;

      const now = new Date();
      byId("local-time").textContent = new Intl.DateTimeFormat(undefined, {
        weekday: "long", month: "long", day: "numeric", timeZone: data.timezone || "UTC"
      }).format(now);
      const grid = byId("forecast-grid");
      grid.replaceChildren(...data.daily.time.slice(0, 5).map((date, index) => {
        const weather = weatherFor(data.daily.weather_code[index]);
        const card = document.createElement("article");
        card.className = "day-card";
        const name = document.createElement("span");
        name.className = "day-name";
        name.textContent = dayName(date, index);
        const icon = document.createElement("span");
        icon.className = "day-icon";
        icon.setAttribute("aria-hidden", "true");
        icon.textContent = weather.icon;
        const condition = document.createElement("span");
        condition.className = "day-condition";
        condition.textContent = weather.label;
        const temps = document.createElement("span");
        temps.className = "day-temps";
        const high = document.createElement("span");
        high.textContent = `${Math.round(data.daily.temperature_2m_max[index])}°`;
        const low = document.createElement("span");
        low.className = "day-low";
        low.textContent = `${Math.round(data.daily.temperature_2m_min[index])}°`;
        temps.append(high, low);
        card.append(name, icon, condition, temps);
        return card;
      }));
      byId("data-status").textContent = isFallback ? "Typical conditions" : "Live weather";
    }

    async function loadCity(city) {
      button.disabled = true;
      button.textContent = "Loading…";
      message.classList.remove("error");
      message.textContent = "";
      try {
        const search = new URL("https://geocoding-api.open-meteo.com/v1/search");
        search.search = new URLSearchParams({ name: city, count: "1", language: "en", format: "json" });
        const geoResponse = await fetch(search);
        if (!geoResponse.ok) throw new Error("City search is temporarily unavailable.");
        const location = (await geoResponse.json()).results?.[0];
        if (!location) throw new Error(`No city found for “${city}”. Try another name.`);

        const forecastUrl = new URL("https://api.open-meteo.com/v1/forecast");
        forecastUrl.search = new URLSearchParams({
          latitude: location.latitude,
          longitude: location.longitude,
          current: "temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m",
          daily: "weather_code,temperature_2m_max,temperature_2m_min",
          timezone: "auto",
          forecast_days: "5"
        });
        const response = await fetch(forecastUrl);
        if (!response.ok) throw new Error("Live weather is temporarily unavailable.");
        const data = await response.json();
        showWeather({ ...data, city: location.name, country: location.country, timezone: data.timezone }, false);
      } catch (error) {
        if (error instanceof TypeError) {
          showWeather(fallback, true);
          message.classList.add("error");
          message.textContent = `Couldn't reach live weather. Showing typical conditions${city.toLowerCase() === "tokyo" ? " for Tokyo" : " for Tokyo instead"}.`;
        } else {
          message.classList.add("error");
          message.textContent = error.message;
        }
      } finally {
        button.disabled = false;
        button.textContent = "Search";
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const city = input.value.trim();
      if (city) loadCity(city);
    });
    showWeather(fallback, true);
    loadCity("Tokyo");
  </script>
</body>
</html>
